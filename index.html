<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Burkanic Studio | Výběr her</title>
<style>
  :root { color-scheme: dark; background: #0a0c12; color: #f2f4fa; font: 1rem system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; background: radial-gradient(ellipse at 50% 0%, #16233a, transparent 68%); }
  [hidden] { display: none !important; }
  button, input { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: wait; opacity: .65; }
  :focus-visible { outline: 3px solid #a7ccff; outline-offset: 4px; }
  #lock { display: grid; min-height: 100svh; place-items: center; padding: 1rem; }
  form { width: min(100%, 26rem); padding: clamp(1.25rem, 6vw, 2rem); background: #131923; border: 1px solid #344052; border-radius: 1rem; box-shadow: 0 1.25rem 4rem #0007; }
  h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.5rem); line-height: 1.1; }
  .studio { color: #adcbf6; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; font-size: .875rem; margin: 0 0 .75rem; }
  label { display: block; margin: 1.5rem 0 .45rem; }
  input { width: 100%; border: 1px solid #65738b; border-radius: .45rem; background: #0d111a; color: inherit; padding: .75rem; }
  .primary { border: 0; color: #0a1730; background: #a7ccff; border-radius: .45rem; padding: .75rem 1rem; font-weight: 700; }
  form .primary { width: 100%; margin-top: .85rem; }
  .message { color: #ffb6b9; margin: .75rem 0 0; }
  #library { max-width: 53rem; margin: auto; padding: clamp(1.25rem, 4vw, 2.75rem); }
  header { margin-bottom: 1.5rem; }
  .games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(.8rem, 3vw, 1.6rem); }
  .card { display: grid; grid-template-rows: auto 1fr; text-align: left; padding: 0; overflow: hidden; border: 1px solid #3c4b63; border-radius: .85rem; background: #151d2b; color: inherit; }
  .card:hover { border-color: #a7ccff; background: #202d43; }
  .cover { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: contain; background: #090b10; }
  .details { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: .65rem; padding: .85rem; }
  .game-title { font-size: clamp(1rem, 2.6vw, 1.2rem); font-weight: 750; }
  .play { color: #adcbf6; font-weight: 700; }
  #player { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: #050609; }
  #player-bar { display: flex; align-items: center; gap: .8rem; padding: .3rem .65rem; background: #141c29; }
  #back { padding: .45rem .65rem; border: 1px solid #5f7391; border-radius: .4rem; color: inherit; background: #202c40; }
  iframe { width: 100%; height: 100%; border: 0; }
  @media (max-width: 340px) { .games { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="lock">
  <form id="unlock">
    <p class="studio">Burkanic Studio</p>
    <h1>Výběr her</h1>
    <label for="code">Přístupový kód</label>
    <input id="code" type="password" required autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="primary" type="submit">Odemknout</button>
    <p class="message" id="lock-message" role="status" hidden></p>
  </form>
</main>
<main id="library" hidden>
  <header>
    <p class="studio">Burkanic Studio</p>
    <h1 id="library-title" tabindex="-1">Vyber si hru</h1>
  </header>
  <div class="games">
    <button class="card" type="button" data-game="simulator">
      <img class="cover" alt="">
      <span class="details"><span class="game-title">Manipulovací simulátor</span><span class="play">Hrát</span></span>
    </button>
    <button class="card" type="button" data-game="petrik">
      <img class="cover" alt="">
      <span class="details"><span class="game-title">Petřík hororovka</span><span class="play">Hrát</span></span>
    </button>
  </div>
  <p class="message" id="library-message" role="status" hidden></p>
</main>
<section id="player" aria-label="Hra" hidden>
  <div id="player-bar"><button id="back" type="button">Zpět k výběru</button><span id="current-title"></span></div>
  <div id="screen"></div>
</section>
<script>
  const lock = document.querySelector('#lock');
  const form = document.querySelector('#unlock');
  const input = document.querySelector('#code');
  const unlock = form.querySelector('button');
  const library = document.querySelector('#library');
  const player = document.querySelector('#player');
  const cards = [...document.querySelectorAll('.card')];
  const screen = document.querySelector('#screen');
  const back = document.querySelector('#back');
  const lockMessage = document.querySelector('#lock-message');
  const libraryMessage = document.querySelector('#library-message');
  const salt = Uint8Array.from(atob('o7S4J0fPdnmv8Hl8SZEb/g=='), character => character.charCodeAt(0));
  const decoder = new TextDecoder();
  let gameKey;
  let activeCard;

  function showMessage(element, text) {
    element.textContent = text;
    element.hidden = !text;
  }

  async function load(name, key) {
    const response = await fetch('assets/' + name + '.bin');
    if (!response.ok) throw new Error('Download failed');
    const encrypted = new Uint8Array(await response.arrayBuffer());
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: encrypted.subarray(0, 12) }, key, encrypted.subarray(12));
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    unlock.disabled = true;
    showMessage(lockMessage, '');
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey']);
      const candidate = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const covers = JSON.parse(decoder.decode(await load('covers', candidate)));
      for (const card of cards) card.querySelector('img').src = covers[card.dataset.game];
      gameKey = candidate;
      input.value = '';
      lock.hidden = true;
      library.hidden = false;
      document.querySelector('#library-title').focus();
    } catch (error) {
      showMessage(lockMessage, error.name === 'OperationError' ? 'Nesprávný kód.' : 'Knihovnu se nepodařilo načíst. Zkus to znovu.');
      input.focus();
      input.select();
    } finally {
      unlock.disabled = false;
    }
  });

  for (const card of cards) {
    card.addEventListener('click', async () => {
      const title = card.querySelector('.game-title').textContent;
      const playLabel = card.querySelector('.play');
      for (const item of cards) item.disabled = true;
      playLabel.textContent = 'Načítám…';
      showMessage(libraryMessage, '');
      try {
        const html = decoder.decode(await load(card.dataset.game, gameKey));
        const frame = document.createElement('iframe');
        frame.title = title;
        frame.allow = 'autoplay; fullscreen; gamepad';
        frame.allowFullscreen = true;
        frame.srcdoc = html;
        document.querySelector('#current-title').textContent = title;
        activeCard = card;
        player.hidden = false;
        library.hidden = true;
        screen.replaceChildren(frame);
        back.focus();
      } catch {
        showMessage(libraryMessage, 'Hru se nepodařilo načíst. Zkus to znovu.');
        card.focus();
      } finally {
        playLabel.textContent = 'Hrát';
        for (const item of cards) item.disabled = false;
      }
    });
  }

  back.addEventListener('click', () => {
    screen.replaceChildren();
    player.hidden = true;
    library.hidden = false;
    activeCard.focus();
  });
</script>
</body>
</html>
